
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus | Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #111827;
            padding: 40px;
            border-radius: 22px;
            border: 1px solid #263449;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .error {
            background: #7f1d1d;
            color: #fecaca;
        }

        .success {
            background: #14532d;
            color: #bbf7d0;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
        }

        .login a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }

        @media(max-width: 500px) {
            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🎓</div>

    <h1>Create Account</h1>

    <p class="subtitle">Join the Smart Campus student portal</p>

    {% if error %}
        <div class="message error">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="message success">{{ success }}</div>
    {% endif %}

    <form action="{{ url_for('register') }}" method="POST">

        <label>Student Name</label>
        <input
            type="text"
            name="student_name"
            placeholder="Enter your full name"
            required
        >

        <label>Enrollment Number</label>
        <input
            type="text"
            name="enrollment"
            placeholder="Enter enrollment number"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create password (minimum 6 characters)"
            minlength="6"
            required
        >

        <label>Confirm Password</label>
        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm your password"
            required
        >

        <button type="submit">Create Account</button>

    </form>

    <div class="login">
        Already have an account?
        <a href="{{ url_for('home') }}">Login</a>
    </div>

    <div class="footer">
        Smart Campus Portal © 2026
    </div>

</div>

</body>
</html>
