
<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: #1e293b;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: auto;
        }

        .profile-header h2 {
            margin-top: 15px;
        }

        .details {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
        }

        .detail {
            padding: 15px 5px;
            border-bottom: 1px solid #334155;
        }

        .detail:last-child {
            border-bottom: none;
        }

        .label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 17px;
            font-weight: bold;
        }

        .status {
            color: #4ade80;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Profile</h1>

        <div class="profile-header">
            <div class="avatar">🎓</div>

            <h2>{{ student["student_name"] }}</h2>

            <p style="color: #94a3b8;">Smart Campus Student</p>
        </div>

        <div class="details">

            <div class="detail">
                <div class="label">Student Name</div>
                <div class="value">{{ student["student_name"] }}</div>
            </div>

            <div class="detail">
                <div class="label">Enrollment Number</div>
                <div class="value">{{ student["enrollment_number"] }}</div>
            </div>

            <div class="detail">
                <div class="label">Account Status</div>
                <div class="value status">● Active</div>
            </div>

            <div class="detail">
                <div class="label">Portal</div>
                <div class="value">Smart Campus Student Portal</div>
            </div>

        </div>

        <a href="{{ url_for('dashboard') }}" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
